name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 语义化发布
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --dev

      - name: 运行测试
        run: uv run pytest

      # 按提交信息（feat/fix/perf 等）计算下一版本号，
      # 推送版本提交与 tag，并创建带 CHANGELOG 的 GitHub Release
      - name: 语义化版本发布
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传构建产物到 Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv build
          gh release upload "${{ steps.release.outputs.tag }}" dist/* --clobber
