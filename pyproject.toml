[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# atk 与 vendored 需要同级安装：connect/session.py 通过相对路径定位 vendored/
[tool.hatch.build.targets.wheel]
packages = ["src/atk", "src/vendored"]

[project]
name = "atk-sdk"
version = "1.2.0"
description = "High-level Python SDK for ATK (Analytical Toolkit)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ATK SDK Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = []

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/ouyangjiahong26/atk-python-sdk"
Documentation = "https://ouyangjiahong26.github.io/atk-python-sdk"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/atk/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"
upload_to_pypi = false

[tool.semantic_release.branches.master]
match = "master"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/vendored/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
